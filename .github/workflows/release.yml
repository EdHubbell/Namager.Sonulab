name: Release

on:
  push:
    # Tags must be numeric vX.Y.Z (MSI ProductVersion constraint) — e.g. v0.9.0, not v0.9.0-rc1.
    tags: ['v*']

permissions:
  contents: write   # create the release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Derive version from tag
        run: echo "VERSION=$('${{ github.ref_name }}'.TrimStart('v'))" >> $env:GITHUB_ENV

      - name: Test (release gate)
        run: dotnet test --nologo

      - name: Publish app (self-contained win-x64)
        run: dotnet publish src/Namager.App -c Release -r win-x64 --self-contained true -p:Version=$env:VERSION

      - name: Build installer
        run: dotnet build src/Namager.Installer -c Release -p:ProductVersion=$env:VERSION

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: src/Namager.Installer/bin/**/*.msi
          generate_release_notes: true
          body: |
            ### Install
            Download the `.msi` below and run it. Windows SmartScreen will warn because the
            installer is unsigned — click **More info → Run anyway**. No admin rights and no
            .NET install needed.

      # namager.app builds its download link from the releases API. It already rebuilds on a
      # nightly cron, so this only closes the gap from ~24h to ~1min — never let it fail a
      # release. An expired token or a GitHub API hiccup goes yellow here and the cron repairs
      # the site within a day. The API path deliberately has NO leading slash: `gh` accepts
      # both, but a leading one gets rewritten into a filesystem path under bash, which would
      # break this step if the job ever gains `shell: bash`.
      - name: Notify the namager.app website
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: gh api --method POST repos/EdHubbell/Namager.app.website/dispatches -f event_type=release-published
